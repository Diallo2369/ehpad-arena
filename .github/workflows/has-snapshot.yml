# Sonde ponctuelle : télécharge les fichiers d'évaluation de la HAS (inaccessibles depuis
# l'environnement de Claude) et les dépose sur la branche has-snapshot pour inspection.
name: Copie des fichiers HAS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/has-snapshot.yml]

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Télécharger
        run: |
          mkdir -p snap && cd snap
          B=https://minio.data.has-sante.fr/synae/data/prod/open_data
          for f in dictionnaire_variables.xlsx open_data_echelle_qualite.parquet open_data_par_essms.parquet open_data_par_eval.parquet; do
            curl -fsS --retry 4 --retry-delay 10 -o "$f" "$B/$f"
          done
          ls -la
      - name: Publier sur la branche has-snapshot
        run: |
          cd snap
          git init -q -b has-snapshot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Copie des fichiers HAS du $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" has-snapshot
